name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # test:grapheme uses --experimental-strip-types (Node 22+)
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare env
        run: cp .env.test .env

      - name: Lint
        run: npm run lint

      - name: Grapheme tests
        run: npm run test:grapheme

      - name: Board hydrate tests
        run: npm run test:me-board

      - name: Build
        run: npm run build
